name: Cleanup workflow runs

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
      - Sync Europe logos
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["CURRENT_RUN_ID"])

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "tv-guide-workflow-cleanup",
          }

          page = 1
          run_ids = []

          while True:
              url = (
                  f"https://api.github.com/repos/{repo}/actions/runs"
                  f"?status=completed&per_page=100&page={page}"
              )
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)

              runs = data.get("workflow_runs", [])
              if not runs:
                  break

              run_ids.extend(
                  int(run["id"])
                  for run in runs
                  if int(run["id"]) != current
              )

              if len(runs) < 100:
                  break
              page += 1

          for run_id in run_ids:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              req = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(req) as response:
                      response.read()
                  print(f"Deleted workflow run {run_id}")
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print(f"Workflow run {run_id} already deleted")
                      continue
                  raise
          PY
