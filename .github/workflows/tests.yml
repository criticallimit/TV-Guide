name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tv-guide-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate add-on (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml ruff

      - name: Lint Python
        run: ruff check --select E4,E7,E9,F,I tv-guide/app.py

      - name: Validate Python syntax
        run: python -m py_compile tv-guide/app.py

      - name: Validate JavaScript syntax
        run: |
          node --check tv-guide/www/app.js
          node --check tv-guide/www/guide-core.js
          node --check tv-guide/lovelace/tv-guide-card.js
          node --check tv-guide/lovelace/tv-guide-card-loader.js

      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          yaml_files = [
              Path("repository.yaml"),
              Path("tv-guide/config.yaml"),
              Path("tv-guide/translations/de.yaml"),
              Path("tv-guide/translations/en.yaml"),
          ]
          json_files = [
              Path("tv-guide/data/channels.json"),
              Path("tv-guide/data/logo_manifest.json"),
          ]

          for path in yaml_files:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)

          for path in json_files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)

          print("YAML/JSON validation passed")
          PY

      - name: Validate add-on metadata and channel assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import yaml

          root = Path("tv-guide")
          config = yaml.safe_load((root / "config.yaml").read_text(encoding="utf-8"))
          channels_doc = json.loads((root / "data/channels.json").read_text(encoding="utf-8"))
          manifest_doc = json.loads((root / "data/logo_manifest.json").read_text(encoding="utf-8"))

          assert re.fullmatch(r"\d+\.\d+\.\d+", str(config["version"])), "Version must use semantic versioning"
          assert config["slug"] == "tv_guide"
          assert config["ingress"] is True
          assert config["ingress_port"] == 8099
          assert set(config["arch"]) == {"amd64", "aarch64", "armv7"}

          channels = channels_doc["channels"]
          assert len(channels) == 38, f"Expected 38 channels, got {len(channels)}"

          ids = [item["id"] for item in channels]
          assert len(ids) == len(set(ids)), "Duplicate channel IDs found"

          orders = [item["order"] for item in channels]
          assert sorted(orders) == list(range(1, 39)), "Channel order must be contiguous 1..38"

          manifest_channels = manifest_doc.get("channels", [])
          assert len(manifest_channels) == 38, f"Expected 38 logo manifest entries, got {len(manifest_channels)}"

          manifest_by_id = {item["id"]: item for item in manifest_channels}
          assert len(manifest_by_id) == 38, "Duplicate logo manifest IDs found"
          assert set(manifest_by_id) == set(ids), "Channel IDs and logo manifest IDs differ"

          www_dir = root / "www"
          logo_dir = www_dir / "logos"
          png_files = {
              path.relative_to(www_dir).as_posix()
              for path in logo_dir.glob("*.png")
          }
          expected_files = set()

          for channel in channels:
              logo_file = channel.get("logo_file")
              assert logo_file, f"Missing logo_file for {channel['id']}"
              expected_files.add(logo_file)
              logo_path = www_dir / logo_file
              assert logo_path.is_file(), f"Missing logo file: {logo_path}"
              assert logo_path.stat().st_size > 0, f"Empty logo file: {logo_path}"

              manifest_entry = manifest_by_id[channel["id"]]
              assert manifest_entry.get("file") == logo_file, (
                  f"Logo manifest mismatch for {channel['id']}: "
                  f"{manifest_entry.get('file')} != {logo_file}"
              )

          assert png_files == expected_files, (
              f"Unexpected/missing logo files. extra={sorted(png_files - expected_files)} "
              f"missing={sorted(expected_files - png_files)}"
          )

          dockerfile = (root / "Dockerfile").read_text(encoding="utf-8")
          assert "BUILD_ARCH" in dockerfile
          assert "BUILD_VERSION" in dockerfile

          run_script = (root / "run.sh").read_text(encoding="utf-8")
          assert "tv-guide-card-loader.js" in run_script
          assert "tv-guide-card.js" in run_script

          print("Add-on metadata/channel asset validation passed")
          PY

      - name: Validate frontend references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("tv-guide/www/index.html").read_text(encoding="utf-8")
          js = Path("tv-guide/www/app.js").read_text(encoding="utf-8")

          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          assert not duplicates, f"Duplicate HTML ids: {duplicates}"

          required = set(re.findall(r'getElementById\("([^"]+)"\)', js))
          missing = sorted(required - set(ids))
          assert not missing, f"JavaScript references missing HTML ids: {missing}"

          assert '<script src="guide-core.js"></script>' in html
          assert '<script src="app.js"></script>' in html

          print("Frontend reference validation passed")
          PY

      - name: Regression-test settings persistence API
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import tempfile
          import threading
          from http.server import ThreadingHTTPServer
          from pathlib import Path
          from urllib.request import Request, urlopen

          app_path = Path("tv-guide/app.py").resolve()
          spec = importlib.util.spec_from_file_location("tv_guide_app", app_path)
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)

          with tempfile.TemporaryDirectory() as tmpdir:
              tmp = Path(tmpdir)
              app.OPTIONS_FILE = tmp / "options.json"
              initial = {
                  "default_view": "now",
                  "columns_desktop": 5,
                  "max_channels": 0,
                  "theme_mode": "auto",
                  "epg_url": app.DEFAULT_EPG_URL,
                  "refresh_minutes": 180,
                  "notification_service": "persistent_notification.create",
              }
              app.save_options_file(initial)
              app.STORE.options = {
                  "epg_url": app.DEFAULT_EPG_URL,
                  "refresh_minutes": 180,
                  "notification_service": "persistent_notification.create",
              }

              supervisor_writes = []
              app.update_addon_options = lambda options: supervisor_writes.append(dict(options))

              server = ThreadingHTTPServer(("127.0.0.1", 0), app.Handler)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              base = f"http://127.0.0.1:{server.server_port}"

              wanted = {
                  "default_view": "2200",
                  "columns_desktop": 4,
                  "max_channels": 12,
                  "theme_mode": "light",
                  "epg_url": app.DEFAULT_EPG_URL,
                  "refresh_minutes": 180,
                  "notification_service": "persistent_notification.create",
              }

              try:
                  req = Request(
                      base + "/api/settings",
                      data=json.dumps(wanted).encode("utf-8"),
                      method="POST",
                      headers={"Content-Type": "application/json"},
                  )
                  with urlopen(req, timeout=5) as response:
                      saved = json.loads(response.read().decode("utf-8"))
                  assert saved["ok"] is True, saved
                  assert supervisor_writes == [wanted], supervisor_writes

                  with urlopen(base + "/api/settings", timeout=5) as response:
                      loaded = json.loads(response.read().decode("utf-8"))

                  for key, value in wanted.items():
                      assert loaded[key] == value, f"{key}: {loaded[key]!r} != {value!r}"

                  persisted = json.loads(app.OPTIONS_FILE.read_text(encoding="utf-8"))
                  assert persisted == wanted, persisted
                  assert app.load_options_ui()["theme_mode"] == "light"
                  assert app.load_options_ui()["default_view"] == "2200"
                  print("Settings persistence regression test passed")
              finally:
                  server.shutdown()
                  server.server_close()
          PY

      - name: Regression-test forced light and dark themes
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path("tv-guide/www/app.js").read_text(encoding="utf-8")
          css = Path("tv-guide/www/styles.css").read_text(encoding="utf-8")

          assert 'document.documentElement.style.removeProperty(name)' in js
          assert ':root[data-ha-theme="light"]' in css
          assert '--bg: #f3f3f3;' in css
          assert '--card: #ffffff;' in css
          assert '--text: #111111;' in css
          assert ':root[data-ha-theme="dark"]' in css
          assert '--bg: #111318;' in css
          assert '--card: #1c1f24;' in css
          assert '--text: #e8eaed;' in css

          print("Forced theme regression test passed")
          PY

      - name: Regression-test channel logo theme variants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          css = Path("tv-guide/www/styles.css").read_text(encoding="utf-8")
          core = Path("tv-guide/www/guide-core.js").read_text(encoding="utf-8")
          channels = json.loads(Path("tv-guide/data/channels.json").read_text(encoding="utf-8"))["channels"]
          manifest = json.loads(Path("tv-guide/data/logo_manifest.json").read_text(encoding="utf-8"))["channels"]

          expected_light = {"ard", "swr", "tagesschau24", "prosiebenmaxx"}
          configured = {item["id"] for item in channels if item.get("logo_file_light")}
          assert configured == expected_light, configured

          for item in channels:
              default_path = Path("tv-guide/www") / item["logo_file"]
              assert default_path.is_file() and default_path.stat().st_size > 0, default_path
              if item.get("logo_file_light"):
                  light_path = Path("tv-guide/www") / item["logo_file_light"]
                  assert light_path.is_file() and light_path.stat().st_size > 0, light_path
                  assert light_path.suffix == ".svg"

          manifest_by_id = {item["id"]: item for item in manifest}
          for channel_id in expected_light:
              assert manifest_by_id[channel_id].get("light_file")
              assert manifest_by_id[channel_id]["light_file"] == f"logos/light/{channel_id}.svg"

          assert 'channel-logo-light' in core
          assert 'channel-logo-dark' in core
          assert ':root[data-ha-theme="light"] .channel-logo-light' in css
          assert ':root[data-ha-theme="dark"] .channel-logo-dark' in css
          assert 'drop-shadow(0 0 1px rgba(0,0,0,.72))' not in css

          print("Channel logo theme variant regression test passed")
          PY

      - name: Regression-test EPG date strip
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("tv-guide/www/guide-core.js").read_text(encoding="utf-8")
          app = Path("tv-guide/www/app.js").read_text(encoding="utf-8")

          assert 'function renderDateStrip(selectedDate, availableDateKeys = [])' in core
          assert 'for (let i=0;i<8;i++)' not in core
          assert 'availableProgramDateKeys()' in app
          assert 'TVGuideCore.renderDateStrip(' in app
          assert 'availableProgramDateKeys()' in app

          print("EPG date strip regression test passed")
          PY

      - name: Smoke-test web server
        shell: bash
        run: |
          sudo mkdir -p /data
          sudo chown "$USER":"$USER" /data
          PORT=18099 python tv-guide/app.py >/tmp/tv-guide-ci.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18099/api/status >/tmp/tv-guide-status.json; then
              curl -fsS http://127.0.0.1:18099/api/guide >/tmp/tv-guide-guide.json
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              trap - EXIT
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/tv-guide-ci.log
          exit 1

  docker-build:
    name: Docker build (${{ matrix.build_arch }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        include:
          - build_arch: amd64
            platform: linux/amd64
          - build_arch: aarch64
            platform: linux/arm64
          - build_arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' tv-guide/config.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: ./tv-guide
          file: ./tv-guide/Dockerfile
          push: false
          load: false
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.build_arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
