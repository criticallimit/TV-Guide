name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tv-guide-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate add-on (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml ruff

      - name: Lint Python
        run: ruff check --select E4,E7,E9,F,I tv-guide/app.py tv-guide/tvguide

      - name: Validate Python syntax
        run: python -m compileall -q tv-guide/app.py tv-guide/tvguide

      - name: Validate JavaScript syntax
        run: |
          node --check tv-guide/www/channel-picker.js
          node --check tv-guide/www/app.js
          node --check tv-guide/www/guide-core.js
          node --check tv-guide/www/i18n.js
          node --check tv-guide/www/translations.js
          node --check tv-guide/lovelace/tv-guide-card.js
          node --check tv-guide/lovelace/tv-guide-card-loader.js

      - name: Regression-test source dates and merge integrity
        run: python -m unittest discover -s tv-guide/tests -p "test_*.py" -v

      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          yaml_files = [
              Path("repository.yaml"),
              Path("tv-guide/config.yaml"),
              Path("tv-guide/translations/de.yaml"),
              Path("tv-guide/translations/en.yaml"),
          ]
          json_files = [
              Path("tv-guide/data/channels.json"),
              Path("tv-guide/data/logo_manifest.json"),
          ]

          for path in yaml_files:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)

          for path in json_files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)

          print("YAML/JSON validation passed")
          PY

      - name: Validate add-on metadata and channel assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import yaml

          root = Path("tv-guide")
          config = yaml.safe_load((root / "config.yaml").read_text(encoding="utf-8"))
          for locale in ("de", "en", "nl", "fr", "it", "nb"):
              translation = yaml.safe_load((root / "translations" / f"{locale}.yaml").read_text(encoding="utf-8"))
              assert set(translation["configuration"]) == set(config["options"]), f"Stale or missing settings in {locale}"
          channels_doc = json.loads((root / "data/channels.json").read_text(encoding="utf-8"))
          manifest_doc = json.loads((root / "data/logo_manifest.json").read_text(encoding="utf-8"))

          assert re.fullmatch(r"\d+\.\d+\.\d+", str(config["version"])), "Version must use semantic versioning"
          assert config["slug"] == "tv_guide"
          assert config["ingress"] is True
          assert config["ingress_port"] == 8099
          assert set(config["arch"]) == {"amd64", "aarch64", "armv7"}

          channels = channels_doc["channels"]
          assert len(channels) == 50, f"Expected 50 channels, got {len(channels)}"

          ids = [item["id"] for item in channels]
          assert len(ids) == len(set(ids)), "Duplicate channel IDs found"

          orders = [item["order"] for item in channels]
          assert sorted(orders) == list(range(1, 51)), "Channel order must be contiguous 1..50"

          manifest_channels = manifest_doc.get("channels", [])
          assert len(manifest_channels) == 50, f"Expected 50 logo manifest entries, got {len(manifest_channels)}"

          manifest_by_id = {item["id"]: item for item in manifest_channels}
          assert len(manifest_by_id) == 50, "Duplicate logo manifest IDs found"
          assert set(manifest_by_id) == set(ids), "Channel IDs and logo manifest IDs differ"

          www_dir = root / "www"
          logo_dir = www_dir / "logos"
          theme_files = {
              path.relative_to(www_dir).as_posix()
              for theme in ("light", "dark")
              for path in (logo_dir / theme).glob("*.svg")
          }
          expected_files = set()

          for channel in channels:
              logo_file = channel.get("logo_file")
              manifest_entry = manifest_by_id[channel["id"]]
              assert manifest_entry.get("file") == logo_file, (
                  f"Logo manifest mismatch for {channel['id']}: "
                  f"{manifest_entry.get('file')} != {logo_file}"
              )

              if not logo_file:
                  assert manifest_entry.get("storage") == "feed", (
                      f"Channel without bundled logo must use feed storage: {channel['id']}"
                  )
                  continue

              expected_files.add(logo_file)
              expected_files.add(channel["logo_file_light"])
              logo_path = www_dir / logo_file
              assert logo_path.is_file(), f"Missing logo file: {logo_path}"
              assert logo_path.stat().st_size > 0, f"Empty logo file: {logo_path}"

          assert theme_files == expected_files, (
              f"Unexpected/missing logo files. extra={sorted(theme_files - expected_files)} "
              f"missing={sorted(expected_files - theme_files)}"
          )

          dockerfile = (root / "Dockerfile").read_text(encoding="utf-8")
          assert "BUILD_ARCH" in dockerfile
          assert "BUILD_VERSION" in dockerfile

          run_script = (root / "run.sh").read_text(encoding="utf-8")
          assert "tv-guide-card-loader.js" in run_script
          assert "tv-guide-card.js" in run_script

          print("Add-on metadata/channel asset validation passed")
          PY

      - name: Validate frontend references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("tv-guide/www/index.html").read_text(encoding="utf-8")
          js = Path("tv-guide/www/app.js").read_text(encoding="utf-8")

          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          assert not duplicates, f"Duplicate HTML ids: {duplicates}"

          required = set(re.findall(r'getElementById\("([^"]+)"\)', js))
          missing = sorted(required - set(ids))
          assert not missing, f"JavaScript references missing HTML ids: {missing}"

          assert re.search(r'<script src="guide-core\.js(?:\?[^\"]*)?\"></script>', html)
          assert re.search(r'<script src="app\.js(?:\?[^\"]*)?\"></script>', html)

          print("Frontend reference validation passed")
          PY

      - name: Validate language catalogues and automatic selection
        run: node tv-guide/tests/localization.cjs

      - name: Regression-test settings persistence API
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import tempfile
          import threading
          from http.server import ThreadingHTTPServer
          from pathlib import Path
          from urllib.request import Request, urlopen

          app_path = Path("tv-guide/app.py").resolve()
          spec = importlib.util.spec_from_file_location("tv_guide_app", app_path)
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          app = app.backend

          with tempfile.TemporaryDirectory() as tmpdir:
              tmp = Path(tmpdir)
              app.OPTIONS_FILE = tmp / "options.json"
              initial = {
                  "default_view": "now",
                  "columns_desktop": 5,
                  "max_channels": 0,
                  "theme_mode": "auto",
                  "refresh_minutes": 180,
                  "notification_service": "persistent_notification.create",
              }
              app.save_options_file(initial)
              app.STORE.options = {
                  "refresh_minutes": 180,
                  "notification_service": "persistent_notification.create",
              }

              supervisor_writes = []
              app.update_addon_options = lambda options: supervisor_writes.append(dict(options))

              server = ThreadingHTTPServer(("127.0.0.1", 0), app.Handler)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              base = f"http://127.0.0.1:{server.server_port}"

              wanted = {
                  "country": "de",
                  "language": "auto",
                  "default_view": "2200",
                  "columns_desktop": 4,
                  "max_channels": 12,
                  "theme_mode": "light",
                  "refresh_minutes": 180,
                  "notification_service": "persistent_notification.create",
              }

              try:
                  req = Request(
                      base + "/api/settings",
                      data=json.dumps(wanted).encode("utf-8"),
                      method="POST",
                      headers={"Content-Type": "application/json"},
                  )
                  with urlopen(req, timeout=5) as response:
                      saved = json.loads(response.read().decode("utf-8"))
                  assert saved["ok"] is True, saved
                  assert supervisor_writes == [wanted], supervisor_writes

                  with urlopen(base + "/api/settings", timeout=5) as response:
                      loaded = json.loads(response.read().decode("utf-8"))

                  for key, value in wanted.items():
                      assert loaded[key] == value, f"{key}: {loaded[key]!r} != {value!r}"

                  persisted = json.loads(app.OPTIONS_FILE.read_text(encoding="utf-8"))
                  assert persisted == wanted, persisted
                  assert app.load_options_ui()["theme_mode"] == "light"
                  assert app.load_options_ui()["default_view"] == "2200"
                  print("Settings persistence regression test passed")
              finally:
                  server.shutdown()
                  server.server_close()
          PY

      - name: Regression-test forced light and dark themes
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path("tv-guide/www/app.js").read_text(encoding="utf-8")
          css = Path("tv-guide/www/styles.css").read_text(encoding="utf-8")

          assert 'document.documentElement.style.removeProperty(name)' in js
          assert ':root[data-ha-theme="light"]' in css
          assert '--bg: #f2f2f2;' in css
          assert '--card: #ffffff;' in css
          assert '--text: #171717;' in css
          assert '--accent: #2563eb;' in css
          assert ':root[data-ha-theme="dark"]' in css
          assert '--bg: #111318;' in css
          assert '--card: #1c1f24;' in css
          assert '--text: #eef0f2;' in css
          assert '--accent: #60a5fa;' in css

          assert '--topbar-bg: #72c4b8;' in css
          assert '--topbar-bg: #20252b;' in css
          assert 'background: var(--topbar-bg);' in css

          print("Forced theme regression test passed")
          PY

      - name: Regression-test channel logo theme variants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          css = Path("tv-guide/www/styles.css").read_text(encoding="utf-8")
          core = Path("tv-guide/www/guide-core.js").read_text(encoding="utf-8")
          channels = json.loads(Path("tv-guide/data/channels.json").read_text(encoding="utf-8"))["channels"]
          manifest = json.loads(Path("tv-guide/data/logo_manifest.json").read_text(encoding="utf-8"))["channels"]

          expected_light = {item["id"] for item in channels}
          configured = {item["id"] for item in channels if item.get("logo_file_light")}
          assert configured == expected_light, configured

          for item in channels:
              if item.get("logo_file"):
                  default_path = Path("tv-guide/www") / item["logo_file"]
                  assert default_path.is_file() and default_path.stat().st_size > 0, default_path
              if item.get("logo_file_light"):
                  light_path = Path("tv-guide/www") / item["logo_file_light"]
                  assert light_path.is_file() and light_path.stat().st_size > 0, light_path
                  assert light_path.suffix == ".svg"

          manifest_by_id = {item["id"]: item for item in manifest}
          for channel_id in expected_light:
              assert manifest_by_id[channel_id].get("light_file")
              assert manifest_by_id[channel_id]["light_file"] == f"logos/light/{channel_id}.svg"

          assert 'channel-logo-light' in core
          assert 'channel-logo-dark' in core
          assert ':root[data-ha-theme="light"] .channel-logo-light' in css
          assert ':root[data-ha-theme="dark"] .channel-logo-dark' in css
          assert 'drop-shadow(0 0 1px rgba(0,0,0,.72))' not in css

          print("Channel logo theme variant regression test passed")
          PY

      - name: Regression-test Other Times dialog
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("tv-guide/www/index.html").read_text(encoding="utf-8")
          app = Path("tv-guide/www/app.js").read_text(encoding="utf-8")
          css = Path("tv-guide/www/styles.css").read_text(encoding="utf-8")

          assert 'id="dateStrip"' not in html
          assert 'class="date-strip"' not in html
          assert 'data-i18n="Andere Zeiten"' in html
          assert 'id="customTimeBar"' not in html
          assert 'id="customTimeDialog"' in html
          assert 'id="customDate" type="date"' in html
          assert 'id="customTime" type="time"' in html
          assert 'id="cancelCustomTime"' in html

          assert 'const customTimeDialog = document.getElementById("customTimeDialog");' in app
          assert 'customTimeDialog.showModal();' in app
          assert 'customTimeDialog.close();' in app
          assert 'mode = "other";' in app
          assert 'selectedDate = startOfDay(target);' in app
          assert 'customTarget = target;' in app
          assert 'customTimeBar' not in app

          assert ".custom-time-dialog" in css
          assert ".custom-time-fields" in css
          assert ".custom-time-actions" in css

          print("Other Times dialog regression test passed")
          PY

      - name: Regression-test teletext programme sources
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("tvguide_app", "tv-guide/app.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          app = app.backend

          expected = {"ard","zdf","zdfneo","zdfinfo","3sat","wdr","ndr"}
          assert expected.issubset(app.TELETEXT_PROVIDER_BY_CHANNEL)

          assert app.TELETEXT_PROVIDER_BY_CHANNEL["ard"]["today"][0].endswith("/301")
          assert app.TELETEXT_PROVIDER_BY_CHANNEL["ard"]["tomorrow"][0].endswith("/305")
          assert "/teletext/zdf/seiten/301.html" in app.TELETEXT_PROVIDER_BY_CHANNEL["zdf"]["today"][0]
          assert app.TELETEXT_PROVIDER_BY_CHANNEL["wdr"]["today"][0].endswith("/301.html")
          assert app.TELETEXT_PROVIDER_BY_CHANNEL["wdr"]["tomorrow"][0].endswith("/325.html")
          assert app.TELETEXT_PROVIDER_BY_CHANNEL["ndr"]["today"][0].endswith("/301_01.htm")

          source = "\n".join(path.read_text(encoding="utf-8") for path in sorted(Path("tv-guide/tvguide").glob("*.py")))
          assert "def _fetch_teletext_programs(self, channel_id):" in source
          assert "teletext = self._fetch_teletext_programs(channel_id)" in source
          assert "official = self._merge_program_lists(official, teletext)" in source

          print("Teletext programme source regression test passed")
          PY

      - name: Regression-test secondary web provider parsing
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import datetime
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("tvguide_app", "tv-guide/app.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          app = app.backend

          assert set(app.SECONDARY_WEB_PROVIDER_BY_CHANNEL) == {
              "euronews","hgtv","nickelodeon","comedycentral"
          }

          store = app.EPGStore.__new__(app.EPGStore)
          lines = [
              "04:10",
              "04:33",
              "South Park",
              "04:33",
              "04:55",
              "TripTank",
          ]
          programmes = store._parse_schedule_lines(
              lines,
              datetime.now().astimezone().date(),
          )
          assert [item["title"] for item in programmes] == ["South Park", "TripTank"]

          source = "\n".join(path.read_text(encoding="utf-8") for path in sorted(Path("tv-guide/tvguide").glob("*.py")))
          assert "def _fetch_secondary_web_programs(self, channel_id):" in source
          assert "SECONDARY_WEB_PROVIDER_BY_CHANNEL" in source
          assert '"secondary_web_channels"' in source

          print("Secondary web provider parsing regression test passed")
          PY

      - name: Regression-test official provider registry
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import datetime
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("tvguide_app", "tv-guide/app.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          app = app.backend

          main_ids = app.base_channel_ids()
          assert len(main_ids) == 50
          assert set(app.OFFICIAL_PROVIDER_AUDIT) == set(main_ids)
          assert sum(1 for item in app.OFFICIAL_PROVIDER_AUDIT.values() if item) == 46
          assert sorted(
              channel_id
              for channel_id, provider in app.OFFICIAL_PROVIDER_AUDIT.items()
              if not provider
          ) == ["comedycentral","euronews","hgtv","nickelodeon"]

          assert set(app.SECONDARY_WEB_PROVIDER_BY_CHANNEL) == {
              "comedycentral","euronews","hgtv","nickelodeon"
          }
          for channel_id in [
              "ard","zdf","rtl","sat1","prosieben","kabeleins","rtlzwei",
              "vox","swr","sr","radiobremen","welt","ntv","sixx",
              "prosiebenmaxx","dmax","sat1gold","voxup","rtlup","tlc",
              "nitro","tele5","superrtl","kika","sport1","kabeleinsdoku",
              "disneychannel","n24doku","eurosport1","weltderwunder","df1",
              "esportsone",
          ]:
              assert app.OFFICIAL_PROVIDER_AUDIT[channel_id], channel_id

          source = "\n".join(path.read_text(encoding="utf-8") for path in sorted(Path("tv-guide/tvguide").glob("*.py")))
          assert "def _fetch_official_programs(self, channel_id, provider):" in source
          assert "def _fetch_generic_official_programs(self, channel_id, provider):" in source
          assert "def _merge_program_lists(self, existing, incoming):" in source
          assert "self._official_html_cache = {}" in source
          assert '"official_provider_count"' in source
          assert '"official_provider_missing"' in source

          store = app.EPGStore.__new__(app.EPGStore)
          html = """
          <div>Nachts</div>
          <div>00:15</div><h2>Erste Sendung</h2>
          <div>01:00 - 02:00</div><h2>Zweite Sendung</h2>
          <div>Abends</div>
          <div>20:15</div><h2>Primetime Test</h2>
          """
          lines = store._html_lines(html)
          programmes = store._parse_schedule_lines(
              lines,
              datetime.now().astimezone().date(),
          )
          titles = [item["title"] for item in programmes]
          assert "Erste Sendung" in titles
          assert "Zweite Sendung" in titles
          assert "Primetime Test" in titles

          print("Official provider registry regression test passed")
          PY

      - name: Regression-test live SWR and SR parser shapes
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import datetime
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("tvguide_app", "tv-guide/app.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          app = app.backend

          store = app.EPGStore.__new__(app.EPGStore)

          today = datetime.now(app.EPG_TIMEZONE).date()
          swr_date = f"{today.day}.{today.month}.{today.year}"
          iso_date = today.isoformat()

          swr_html = f"""
          <div>{swr_date} 20:00</div><h2>Tagesschau</h2>
          <div>{swr_date} 20:15</div><h2>Selbscht ischt d'r Mann</h2>
          <div>{swr_date} 21:50</div><h2>Scheunenknaller</h2>
          """
          sr_html = f"""
          <li data-pg-show-start="{iso_date}T20:00:00+02:00" data-pg-show-duration="15"><a title="Tagesschau">20:00 Tagesschau</a></li>
          <li data-pg-show-start="{iso_date}T20:15:00+02:00" data-pg-show-duration="45"><a title="Wildes Italien">20:15 Wildes Italien</a></li>
          <li data-pg-show-start="{iso_date}T21:45:00+02:00" data-pg-show-duration="45"><a title="Nationalparks">21:45 Nationalparks</a></li>
          """

          store._fetch_html = lambda url, label: swr_html if label == "SWR" else sr_html

          swr = store._fetch_swr_programs()
          sr = store._fetch_sr_programs()

          assert any(item["title"] == "Tagesschau" for item in swr)
          assert any(item["title"] == "Selbscht ischt d'r Mann" for item in swr)
          assert any(item["title"] == "Wildes Italien" for item in sr)
          assert any(item["title"] == "Nationalparks" for item in sr)

          source = "\n".join(path.read_text(encoding="utf-8") for path in sorted(Path("tv-guide/tvguide").glob("*.py")))
          assert "data-pg-show-start" in source
          assert "pending_start = None" in source

          print("Live SWR and SR parser shape regression test passed")
          PY

      - name: Regression-test SWR and SR official fallbacks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          channels = json.loads(Path("tv-guide/data/channels.json").read_text(encoding="utf-8"))["channels"]
          by_id = {item["id"]: item for item in channels}
          source = "\n".join(path.read_text(encoding="utf-8") for path in sorted(Path("tv-guide/tvguide").glob("*.py")))

          swr = by_id["swr"]
          sr = by_id["sr"]

          assert "SWRFernsehenBadenWurttemberg.de@SD" in swr["xmltv_ids"]
          assert "SWRFernsehenRheinlandPfalz.de@SD" in swr["xmltv_ids"]
          assert "SRFernsehen.de@SD" in sr["xmltv_ids"]

          assert 'SWR_PROGRAM_URL = "https://www.swr.de/video/tv-programm/index.html?swx_pcDate={date}&swx_pcStation=7.0.0"' in source
          assert 'SR_PROGRAM_URL = "https://www.sr.de/sr/epg/tv/srtv/station108~_day-{date}.html"' in source
          assert "def _fetch_swr_programs(self):" in source
          assert "def _fetch_sr_programs(self):" in source
          assert '"swr": {"kind": "swr"}' in source
          assert '"sr": {"kind": "sr"}' in source
          assert "def _fetch_official_programs(self, channel_id, provider):" in source

          print("SWR and SR official fallback regression test passed")
          PY

      - name: Regression-test parsed EPG cache invalidation
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("tvguide_app", "tv-guide/app.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          app = app.backend

          assert app.PARSED_CACHE_SCHEMA_VERSION == 10

          store = app.EPGStore.__new__(app.EPGStore)
          store.channels = [{"id":"ard","programs":[{"start":"2030-01-01T10:00:00+01:00"}]}]
          store.source_metrics = []
          store.official_metrics = {
              "attempted": 0,
              "enriched": 0,
              "teletext_channels": 0,
              "missing_official": [],
          }
          store.options = {"refresh_minutes": 180}

          original = app.PARSED_CACHE_FILE
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "parsed.json"
              path.write_text(json.dumps({
                  "schema_version": 3,
                  "channels": store.channels,
                  "feed_latest_end": "2030-01-02T10:00:00+01:00",
              }), encoding="utf-8")
              app.PARSED_CACHE_FILE = path
              store.cache_schema_current = True
              assert store._load_parsed_cache() is True
              assert store.cache_schema_current is False
              assert store._cache_fresh() is False
              assert store.channels[0]["programs"]

          app.PARSED_CACHE_FILE = original

          source = "\n".join(path.read_text(encoding="utf-8") for path in sorted(Path("tv-guide/tvguide").glob("*.py")))
          assert '"schema_version": self.runtime.PARSED_CACHE_SCHEMA_VERSION' in source
          assert "if not self.cache_schema_current:" in source
          assert "if not self.source_metrics:" in source
          assert "STORE.refresh_running = True" in source
