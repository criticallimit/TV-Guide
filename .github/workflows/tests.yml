          import base64
          import hashlib
          import importlib.util
          import json
          import tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("tvguide_logo_app", "tv-guide/app.py")
          app = importlib.util.module_from_spec(spec)
