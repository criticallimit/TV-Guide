      - name: Smoke-test web server
        shell: bash
        run: |
          sudo mkdir -p /data
          sudo chown "$USER":"$USER" /data
          PORT=18099 python tv-guide/app.py >/tmp/tv-guide-ci.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18099/api/status >/tmp/tv-guide-status.json; then
              curl -fsS http://127.0.0.1:18099/api/guide >/tmp/tv-guide-guide.json
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              trap - EXIT
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/tv-guide-ci.log
          exit 1

  browser-layout:
    name: TV guide layout (Chromium and WebKit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/tv-guide-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/tv-guide-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Compare programme layout with TV guide reference
        env:
          NODE_PATH: ${{ runner.temp }}/tv-guide-browser/node_modules
        run: |
          node tv-guide/tests/programme-layout.cjs
          node tv-guide/tests/settings-localization.cjs
          node tv-guide/tests/documentation-browser.cjs
          node tv-guide/tests/logo-browser.cjs
          node tv-guide/tests/card-picker.cjs
          node tv-guide/tests/performance.cjs
          node tv-guide/tests/card-lifecycle.cjs
          node tv-guide/tests/guide-regressions.cjs
          node tv-guide/tests/personal-channels.cjs

  docker-build:
    name: Docker build (${{ matrix.build_arch }})
    runs-on: ubuntu-latest
    needs: [validate, browser-layout]
    strategy:
      matrix:
        include:
          - build_arch: amd64
            platform: linux/amd64
          - build_arch: aarch64
            platform: linux/arm64
          - build_arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' tv-guide/config.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: ./tv-guide
          file: ./tv-guide/Dockerfile
          push: false
          load: true
          tags: tv-guide-ci:${{ matrix.build_arch }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.build_arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}

      - name: Verify backend inside built image
        run: |
          timeout 60s docker run --rm -i --network none --entrypoint python3 \
            tv-guide-ci:${{ matrix.build_arch }} - < tv-guide/tests/container_smoke.py


  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [validate, browser-layout, docker-build]
    if: ${{ always() }}
    steps:
      - name: Require all CI jobs to pass
        shell: bash
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.browser-layout.result }}" = "success"
          test "${{ needs.docker-build.result }}" = "success"
