name: Publish TV Guide 1.1.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-1.1.4.yml"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for final main and publish 1.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 20
          TARGET="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)"
          echo "Final main target: $TARGET"

          VERSION="$(gh api repos/${{ github.repository }}/contents/tv-guide/config.yaml?ref="$TARGET" --jq .content | base64 -d | sed -n 's/^version: "\([^"]*\)"/\1/p')"
          test "$VERSION" = "1.1.4"

          for i in $(seq 1 80); do
            RUN="$(gh run list --repo "${{ github.repository }}" --workflow CI --commit "$TARGET" --limit 1 --json status,conclusion --jq '.[0] // empty')"
            if [ -n "$RUN" ]; then
              STATUS="$(printf '%s' "$RUN" | jq -r .status)"
              CONCLUSION="$(printf '%s' "$RUN" | jq -r '.conclusion // ""')"
              echo "CI: $STATUS $CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                test "$CONCLUSION" = "success"
                break
              fi
            fi
            test "$i" != "80"
            sleep 15
          done

          if gh release view 1.1.4 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release 1.1.4 already exists."
            exit 1
          fi

          NOTES="$(mktemp)"
          gh api repos/${{ github.repository }}/contents/tv-guide/CHANGELOG.md?ref="$TARGET" --jq .content | base64 -d | awk '
            /^## 1\.1\.4$/ {capture=1; next}
            /^## / && capture {exit}
            capture {print}
          ' > "$NOTES"

          gh release create 1.1.4             --repo "${{ github.repository }}"             --target "$TARGET"             --title "TV Guide 1.1.4"             --notes-file "$NOTES"
