name: Force cancel stuck run

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  force-cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel stuck CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method POST             repos/${{ github.repository }}/actions/runs/37365244653/force-cancel
