name: Publish TV Guide 1.1.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-1.1.8.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-tv-guide-1.1.8
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Publish the tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(gh api "repos/$GH_REPO/contents/tv-guide/config.yaml?ref=$TARGET" --jq .content | base64 -d | sed -n 's/^version: "\([^"]*\)"/\1/p')"
          test "$VERSION" = "1.1.8"

          for i in $(seq 1 120); do
            RUN="$(gh run list --repo "$GH_REPO" --workflow CI --commit "$TARGET" --limit 1 --json status,conclusion,event --jq '.[0] // empty')"
            if [ -n "$RUN" ]; then
              STATUS="$(printf '%s' "$RUN" | jq -r .status)"
              CONCLUSION="$(printf '%s' "$RUN" | jq -r '.conclusion // ""')"
              echo "CI: $STATUS $CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                test "$CONCLUSION" = "success"
                test "$(printf '%s' "$RUN" | jq -r .event)" = "push"
                break
              fi
            fi
            test "$i" != "120"
            sleep 15
          done

          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$TARGET"
          if gh release view 1.1.8 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release 1.1.8 already exists; refusing to overwrite it."
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/1.1.8" >/dev/null 2>&1; then
            echo "Tag 1.1.8 already exists; refusing to reuse it."
            exit 1
          fi

          NOTES="$(mktemp)"
          gh api "repos/$GH_REPO/contents/tv-guide/CHANGELOG.md?ref=$TARGET" --jq .content | base64 -d | awk '
            /^## 1\.1\.8$/ {capture=1; next}
            /^## / && capture {exit}
            capture {print}
          ' > "$NOTES"
          test -s "$NOTES"
          gh release create 1.1.8 --repo "$GH_REPO" --target "$TARGET" --title "TV Guide 1.1.8" --notes-file "$NOTES" --latest
