name: Finalize TV Guide 1.1.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-1.1.3.yml"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for final main and its CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 20
          TARGET="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)"
          echo "Final main target: $TARGET"

          VERSION="$(gh api repos/${{ github.repository }}/contents/tv-guide/config.yaml?ref="$TARGET" --jq .content | base64 -d | sed -n 's/^version: "\([^"]*\)"/\1/p')"
          if [ "$VERSION" != "1.1.3" ]; then
            echo "Refusing release: final main has version $VERSION"
            exit 1
          fi

          for i in $(seq 1 60); do
            RUN="$(gh run list --repo "${{ github.repository }}" --workflow CI --commit "$TARGET" --limit 1 --json status,conclusion,databaseId --jq '.[0] // empty')"
            if [ -n "$RUN" ]; then
              STATUS="$(printf '%s' "$RUN" | jq -r .status)"
              CONCLUSION="$(printf '%s' "$RUN" | jq -r '.conclusion // ""')"
              echo "CI: $STATUS $CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" != "success" ]; then
                  echo "Final main CI did not succeed."
                  exit 1
                fi
                break
              fi
            fi
            if [ "$i" = "60" ]; then
              echo "Timed out waiting for final main CI."
              exit 1
            fi
            sleep 15
          done

          if gh release view 1.1.3 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release 1.1.3 already exists."
            exit 1
          fi

          gh release create 1.1.3             --repo "${{ github.repository }}"             --target "$TARGET"             --title "TV Guide 1.1.3"             --notes-file <(gh api repos/${{ github.repository }}/contents/tv-guide/CHANGELOG.md?ref="$TARGET" --jq .content | base64 -d | sed '1,3d')
