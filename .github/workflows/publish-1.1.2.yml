name: Publish TV Guide 1.1.2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Publish 1.1.2 from validated product commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse "$HEAD_SHA^")"
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("tv-guide/config.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*"([^"]+)"', text, re.M)
          print(match.group(1) if match else "")
          PY
          )"
          if [ "$VERSION" != "1.1.2" ]; then
            echo "Refusing release: expected 1.1.2, found $VERSION"
            exit 1
          fi
          if gh release view 1.1.2 >/dev/null 2>&1; then
            echo "Release 1.1.2 already exists."
            exit 0
          fi
          gh release create 1.1.2             --target "$TARGET"             --title "TV Guide 1.1.2"             --notes "Adds Sweden and Swedish UI support, official SVT schedule enrichment, the Europe-wide offline channel-logo library, locale-aware alphabetical country sorting, and updated add-on/GitHub Pages information."
