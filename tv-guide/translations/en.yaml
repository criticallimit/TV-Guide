configuration:
  default_view:
    name: Default view
    description: View shown when TV Guide is opened.
  columns_desktop:
    name: Desktop columns
    description: Number of channel cards per row on large screens.
  max_channels:
    name: Visible channels
    description: Maximum number of visible channels. 0 shows all channels that are not hidden.
  theme_mode:
    name: Appearance
    description: Follow the Home Assistant theme automatically or force light/dark mode.
  epg_url:
    name: EPG URL
    description: URL of an XMLTV or gzipped XMLTV file.
  refresh_minutes:
    name: EPG refresh
    description: Interval in minutes for downloading updated programme data.
  notification_service:
    name: Reminder recipient
    description: Destination for TV reminders. Home Assistant or detected mobile devices can be selected in the TV Guide interface.
