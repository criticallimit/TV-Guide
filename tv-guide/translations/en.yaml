configuration:
  country:
    name: Country
    description: Channels and schedules for Germany, Austria, Switzerland, the Netherlands, Belgium, Denmark, Norway, France and Sweden. BFMTV is temporarily excluded.
  language:
    name: Language
    description: Automatic follows your Home Assistant profile, then the installation
      settings. You can also select a language manually.
  default_view:
    name: Default view
    description: View shown when TV Guide opens.
  columns_desktop:
    name: Channels per row
    description: Number of channel cards per row on large screens.
  max_channels:
    name: Displayed channels
    description: Maximum number of channels; 0 shows the entire selected list.
  theme_mode:
    name: Appearance
    description: Follow Home Assistant or choose light/dark mode.
  refresh_minutes:
    name: Schedule refresh
    description: Interval for downloading schedules, in minutes.
  notification_service:
    name: Reminder destination
    description: Choose Home Assistant or a connected mobile device in TV Guide settings.
  sensor_next_reminder:
    name: "Next reminder"
    description: "Optional for your automations. No MQTT required. Changes take effect when you save."
  sensor_bookmark_count:
    name: "Saved programmes"
    description: "Optional for your automations. No MQTT required. Changes take effect when you save."
  sensor_reminder_count:
    name: "Pending reminders"
    description: "Optional for your automations. No MQTT required. Changes take effect when you save."
  sensor_last_update:
    name: "Last EPG update"
    description: "Optional for your automations. No MQTT required. Changes take effect when you save."
  sensor_refresh_running:
    name: "EPG update in progress"
    description: "Optional for your automations. No MQTT required. Changes take effect when you save."
