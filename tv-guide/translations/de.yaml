configuration:
  default_view:
    name: Standardansicht
    description: Ansicht, die beim Öffnen angezeigt werden soll.
  columns_desktop:
    name: Spalten am Desktop
    description: Anzahl der Senderkacheln pro Reihe auf großen Bildschirmen.
  max_channels:
    name: Angezeigte Sender
    description: Maximale Anzahl sichtbarer Sender. 0 zeigt alle nicht ausgeblendeten Sender.
  theme_mode:
    name: Darstellung
    description: Home-Assistant-Theme automatisch übernehmen oder Hell/Dunkel fest vorgeben.
  epg_url:
    name: EPG-URL
    description: URL zu einer XMLTV- oder XMLTV-GZIP-Datei.
  refresh_minutes:
    name: EPG-Aktualisierung
    description: Intervall in Minuten, in dem neue Programmdaten geladen werden.
  notification_service:
    name: Empfänger der Erinnerungen
    description: Ziel für TV-Erinnerungen. In der TV-Guide-Oberfläche können Home Assistant oder erkannte Mobilgeräte ausgewählt werden.
