configuration:
  country:
    name: Land
    description: Senderlisten und Programmdaten für Deutschland, Österreich, Schweiz,
      Niederlande, Belgien oder Norwegen.
  language:
    name: Sprache
    description: Automatisch folgt dem Home-Assistant-Profil; ohne Profil werden die
      Installationsangaben verwendet. Alternativ eine Sprache fest auswählen.
  default_view:
    name: Standardansicht
    description: Ansicht beim Öffnen von TV Guide.
  columns_desktop:
    name: Sender pro Reihe
    description: Anzahl der Senderkacheln pro Reihe auf großen Bildschirmen.
  max_channels:
    name: Angezeigte Sender
    description: Maximale Senderanzahl; 0 zeigt alle Sender der gewählten Liste.
  theme_mode:
    name: Darstellung
    description: Home-Assistant-Darstellung übernehmen oder Hell/Dunkel wählen.
  refresh_minutes:
    name: EPG-Aktualisierung
    description: Intervall zum Laden neuer Programmdaten in Minuten.
  notification_service:
    name: Empfänger der Erinnerungen
    description: Wähle Home Assistant oder ein verbundenes Mobilgerät im Einstellungsmenü
      von TV Guide.
