configuration:
  country:
    name: Land
    description: Zenders en programma’s voor Duitsland, Oostenrijk, Zwitserland, Nederland, België, Denemarken, Noorwegen, Frankrijk en Zweden. BFMTV is voorlopig niet beschikbaar.
      Het Verenigd Koninkrijk wordt ook ondersteund.
  language:
    name: Taal
    description: Automatisch volgt je Home Assistant-profiel en daarna de installatie-instellingen.
      Je kunt ook zelf een taal kiezen.
  default_view:
    name: Standaardweergave
    description: Weergave bij het openen van TV Guide.
  columns_desktop:
    name: Zenders per rij
    description: Aantal zenderkaarten per rij op grote schermen.
  max_channels:
    name: Getoonde zenders
    description: Maximumaantal zenders; 0 toont de volledige gekozen lijst.
  theme_mode:
    name: Uiterlijk
    description: Volg Home Assistant of kies licht/donker.
  refresh_minutes:
    name: Programma vernieuwen
    description: Interval voor het ophalen van programma’s, in minuten.
  notification_service:
    name: Ontvanger van herinneringen
    description: Kies Home Assistant of een verbonden mobiel apparaat in de instellingen
      van TV Guide.
  sensor_next_reminder:
    name: "Volgende herinnering"
    description: "Tijdstip van de volgende melding."
  sensor_bookmark_count:
    name: "Bewaarde programma’s"
    description: "Aantal opgeslagen programma’s die nog niet zijn afgelopen."
  sensor_reminder_count:
    name: "Openstaande herinneringen"
    description: "Aantal openstaande meldingen."
  sensor_last_update:
    name: "Laatste EPG-update"
    description: "Tijdstip waarop programmagegevens voor het laatst zijn geladen."
  sensor_refresh_running:
    name: "EPG-update bezig"
    description: "Geeft aan of programmagegevens worden bijgewerkt."
