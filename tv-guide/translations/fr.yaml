configuration:
  country:
    name: Pays
    description: Chaînes et programmes pour l’Allemagne, l’Autriche, la Suisse, les Pays-Bas, la Belgique, le Danemark, la Norvège, la France et la Suède. BFMTV est temporairement exclue.
  language:
    name: Langue
    description: Le mode automatique suit votre profil Home Assistant, puis les paramètres
      de l’installation. Vous pouvez aussi choisir une langue.
  default_view:
    name: Vue par défaut
    description: Vue affichée à l’ouverture de TV Guide.
  columns_desktop:
    name: Chaînes par ligne
    description: Nombre de chaînes par ligne sur les grands écrans.
  max_channels:
    name: Chaînes affichées
    description: Nombre maximal de chaînes ; 0 affiche toute la liste choisie.
  theme_mode:
    name: Apparence
    description: Suivre Home Assistant ou choisir le mode clair/sombre.
  refresh_minutes:
    name: Actualisation des programmes
    description: Intervalle de téléchargement des programmes, en minutes.
  notification_service:
    name: Destinataire des rappels
    description: Choisissez Home Assistant ou un appareil mobile connecté dans les
      paramètres de TV Guide.
  sensor_next_reminder:
    name: "Prochain rappel"
    description: "Facultatif pour vos automatisations. MQTT non requis. Les modifications prennent effet après enregistrement."
  sensor_bookmark_count:
    name: "Programmes enregistrés"
    description: "Facultatif pour vos automatisations. MQTT non requis. Les modifications prennent effet après enregistrement."
  sensor_reminder_count:
    name: "Rappels en attente"
    description: "Facultatif pour vos automatisations. MQTT non requis. Les modifications prennent effet après enregistrement."
  sensor_last_update:
    name: "Dernière mise à jour EPG"
    description: "Facultatif pour vos automatisations. MQTT non requis. Les modifications prennent effet après enregistrement."
  sensor_refresh_running:
    name: "Mise à jour EPG en cours"
    description: "Facultatif pour vos automatisations. MQTT non requis. Les modifications prennent effet après enregistrement."
