<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TV Programm</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="headline-row">
      <nav class="times" aria-label="Schnellwahl Uhrzeit">
        <button class="tab active" data-mode="now">JETZT</button>
        <button class="tab" data-mode="2015">20:15</button>
        <button class="tab" data-mode="2200">22:00</button>
        <button class="tab" data-mode="other">ANDERE ZEIT</button>
      </nav>
      <h1 id="headline">TV-Programm jetzt</h1>
    </div>
    <p id="status" class="status">EPG wird geladen …</p>

    <div id="dateStrip" class="date-strip" aria-label="Tage"></div>

    <div id="customTimeBar" class="custom-time-bar" hidden>
      <label>
        Datum
        <input id="customDate" type="date">
      </label>
      <label>
        Uhrzeit
        <input id="customTime" type="time" step="300" value="20:15">
      </label>
      <button id="applyCustomTime" class="apply-time" type="button">Anzeigen</button>
    </div>

    <div class="group-row">
      <nav class="groups" aria-label="Sendergruppen">
        <button class="group active">Hauptsender</button>
        <button class="group disabled" title="Folgt später">Sky</button>
        <button class="group disabled" title="Folgt später">Kabel Pay-TV</button>
        <button class="group disabled" title="Folgt später">MagentaTV</button>
      </nav>
      <div class="group-actions">
        <button id="showChannelSettings" class="channel-settings-button" type="button" title="Sender sortieren und ausblenden">☰ Sender</button>
        <button id="showBookmarks" class="saved-button" type="button" title="Gemerkte Sendungen">★ Gemerkt <span id="bookmarkCount">0</span></button>
      </div>
    </div>

    <div id="grid" class="channel-grid" aria-live="polite"></div>
  </main>

  <dialog id="detail">
    <button class="close" aria-label="Schließen">×</button>
    <div id="detailBody"></div>
    <div class="detail-actions">
      <button id="bookmarkProgram" class="bookmark-program" type="button">☆ Sendung merken</button>
      <label class="reminder-control">
        Erinnern
        <select id="reminderMinutes">
          <option value="0">Keine Erinnerung</option>
          <option value="5">5 Minuten vorher</option>
          <option value="10" selected>10 Minuten vorher</option>
          <option value="15">15 Minuten vorher</option>
          <option value="30">30 Minuten vorher</option>
        </select>
      </label>
      <button id="saveReminder" class="reminder-save" type="button">Erinnerung speichern</button>
    </div>
    <p id="reminderStatus" class="reminder-status" aria-live="polite"></p>
  </dialog>

  <dialog id="bookmarksDialog">
    <button class="close bookmarks-close" aria-label="Schließen">×</button>
    <h2>Gemerkte Sendungen</h2>
    <div class="bookmarks-tools">
      <button id="testNotification" class="secondary-action" type="button">Benachrichtigung testen</button>
      <span id="testNotificationStatus" class="bookmarks-tool-status"></span>
    </div>
    <div id="bookmarksBody"></div>
  </dialog>

  <dialog id="channelSettingsDialog" class="channel-settings-dialog">
    <button class="close channel-settings-close" aria-label="Schließen">×</button>
    <h2>Sender anpassen</h2>
    <p class="channel-settings-help">Sender ziehen oder mit den Pfeilen verschieben. Deaktivierte Sender werden im TV-Programm ausgeblendet.</p>
    <div id="channelSettingsList" class="channel-settings-list"></div>
    <div class="channel-settings-actions">
      <button id="resetChannelSettings" class="secondary-action" type="button">Standardsortierung</button>
      <div class="channel-settings-actions-right">
        <button id="cancelChannelSettings" class="secondary-action" type="button">Abbrechen</button>
        <button id="saveChannelSettings" class="primary-action" type="button">Speichern</button>
      </div>
    </div>
    <p id="channelSettingsStatus" class="channel-settings-status" aria-live="polite"></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
