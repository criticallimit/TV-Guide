<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TV Programm</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="times" aria-label="Schnellwahl Uhrzeit">
      <button class="tab active" data-mode="now">JETZT</button>
      <button class="tab" data-mode="2015">20:15</button>
      <button class="tab" data-mode="2200">22:00</button>
      <button class="tab" data-mode="other">ANDERE ZEIT</button>
    </nav>

    <div id="dateStrip" class="date-strip" aria-label="Tage"></div>

    <div id="customTimeBar" class="custom-time-bar" hidden>
      <label>
        Datum
        <input id="customDate" type="date">
      </label>
      <label>
        Uhrzeit
        <input id="customTime" type="time" step="300" value="20:15">
      </label>
      <button id="applyCustomTime" class="apply-time" type="button">Anzeigen</button>
    </div>

    <div class="group-row">
      <nav class="groups" aria-label="Sendergruppen">
        <button class="group active">Hauptsender</button>
        <button class="group disabled" title="Folgt später">Sky</button>
        <button class="group disabled" title="Folgt später">Kabel Pay-TV</button>
        <button class="group disabled" title="Folgt später">MagentaTV</button>
      </nav>
      <button id="showBookmarks" class="saved-button" type="button" title="Gemerkte Sendungen">★ Gemerkt <span id="bookmarkCount">0</span></button>
    </div>
  </header>

  <main>
    <h1 id="headline">TV-Programm jetzt</h1>
    <p id="status" class="status">EPG wird geladen …</p>
    <div id="grid" class="channel-grid" aria-live="polite"></div>
  </main>

  <dialog id="detail">
    <button class="close" aria-label="Schließen">×</button>
    <div id="detailBody"></div>
    <button id="bookmarkProgram" class="bookmark-program" type="button">☆ Sendung merken</button>
  </dialog>

  <dialog id="bookmarksDialog">
    <button class="close bookmarks-close" aria-label="Schließen">×</button>
    <h2>Gemerkte Sendungen</h2>
    <div id="bookmarksBody"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
