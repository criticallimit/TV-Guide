name: "TV Guide"
version: "0.2.2"
slug: "tv_guide"
description: "Fernsehzeitschrift für Home Assistant mit echter XMLTV/EPG-Anbindung"
url: "https://github.com/criticallimit/TV-Guide"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:television-guide
panel_title: "TV Programm"
homeassistant_api: false
options:
  default_view: "now"
  columns_desktop: 5
  epg_url: "https://www.free-epg.de/api/epg/de.xml.gz"
  refresh_minutes: 180
schema:
  default_view: "list(now|2015|2200)"
  columns_desktop: "int(3,6)"
  epg_url: "str"
  refresh_minutes: "int(30,1440)"
