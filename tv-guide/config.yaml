name: "TV Guide"
version: "1.0.4"
slug: "tv_guide"
description: "Fernsehzeitschrift für Home Assistant mit echter XMLTV/EPG-Anbindung"
url: "https://github.com/criticallimit/TV-Guide"
arch:
  - armv7
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:television-guide
panel_title: "TV Programm"
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  default_view: "now"
  columns_desktop: 5
  max_channels: 0
  theme_mode: "auto"
  epg_url: "https://epg.pw/xmltv/epg_DE.xml.gz"
  refresh_minutes: 180
  notification_service: "persistent_notification.create"
schema:
  default_view: "list(now|2015|2200)"
  columns_desktop: "int(3,6)"
  max_channels: "int(0,500)"
  theme_mode: "list(auto|dark|light)"
  epg_url: "str"
  refresh_minutes: "int(30,1440)"
  notification_service: "str"
