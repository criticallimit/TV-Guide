name: "TV Guide"
version: "1.1.7"
slug: "tv_guide"
description: "Multilingual TV guide for Home Assistant with channel lists, reminders and five optional sensors for automations"
url: "https://github.com/criticallimit/TV-Guide"
arch:
  - armv7
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:television-guide
panel_title: "TV Guide"
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  country: "de"
  language: "auto"
  default_view: "now"
  columns_desktop: 5
  max_channels: 0
  theme_mode: "auto"
  refresh_minutes: 180
  notification_service: "persistent_notification.create"
  sensor_next_reminder: false
  sensor_bookmark_count: false
  sensor_reminder_count: false
  sensor_last_update: false
  sensor_refresh_running: false
schema:
  country: "list(de|at|ch|nl|be|dk|no|fr|se)"
  language: "list(auto|da|de|en|nl|fr|it|nb|sv)"
  default_view: "list(now|1800|2015|2200)"
  columns_desktop: "int(3,6)"
  max_channels: "int(0,500)"
  theme_mode: "list(auto|dark|light)"
  refresh_minutes: "int(30,1440)"
  notification_service: "str"
  sensor_next_reminder: "bool"
  sensor_bookmark_count: "bool"
  sensor_reminder_count: "bool"
  sensor_last_update: "bool"
  sensor_refresh_running: "bool"
